server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: artagram-auth
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_auth}
    username: ${SPRING_DATASOURCE_USERNAME:artagram}
    password: ${SPRING_DATASOURCE_PASSWORD:artagram}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:artagram}
    password: ${SPRING_RABBITMQ_PASSWORD:artagram}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

app:
  jwt:
    key-id: ${JWT_KEY_ID:artagram-key-1}
    issuer: ${JWT_ISSUER:artagram-auth}
    access-token-minutes: ${JWT_ACCESS_MINUTES:120}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../artagram-infra/secrets-dev/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../artagram-infra/secrets-dev/jwt-public.pem}
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  email:
    mode: ${EMAIL_MODE:log}
    from: ${EMAIL_FROM:no-reply@artagram.local}
    verification-link-base: ${EMAIL_VERIFY_URL:http://localhost:8080/api/auth/verificar}
    verificacion-requerida: ${EMAIL_VERIFICACION_REQUERIDA:false}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:artagram.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
